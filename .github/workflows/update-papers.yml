name: Update papers feed

on:
  schedule:
    - cron: '0 9 * * *'  # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch papers from INSPIRE
        run: python scripts/update_papers.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- papers-feed.js; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add papers-feed.js
          git commit -m "Update papers feed from INSPIRE"
          git push
